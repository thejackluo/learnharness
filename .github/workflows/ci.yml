name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron

  hosted:
    name: Hosted runtime (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Plant synthetic payload sentinels
        run: |
          mkdir -p data/chats owner
          printf '%s' 'LH_CI_AUTH_SENTINEL_24' > auth.json
          printf '%s' 'LH_CI_CHATGPT_CREDENTIALS_SENTINEL_24' > chatgpt-credentials.json
          printf '%s' 'LH_CI_XAI_CREDENTIALS_SENTINEL_24' > xai-credentials.json
          printf '%s' 'LH_CI_CHAT_SENTINEL_24' > data/chats/ci-sentinel.json
          printf '%s' 'LH_CI_ENV_SENTINEL_24' > .env.local
          printf '%s' 'LH_CI_OWNER_SENTINEL_24' > owner/owner.json
      - run: npm run build
      - run: node scripts/build-server.mjs
      - name: Scan curated standalone payload
        run: |
          node scripts/scan-payload.mjs .next/standalone \
            --sentinel LH_CI_AUTH_SENTINEL_24 \
            --sentinel LH_CI_CHATGPT_CREDENTIALS_SENTINEL_24 \
            --sentinel LH_CI_XAI_CREDENTIALS_SENTINEL_24 \
            --sentinel LH_CI_CHAT_SENTINEL_24 \
            --sentinel LH_CI_ENV_SENTINEL_24 \
            --sentinel LH_CI_OWNER_SENTINEL_24
      - run: npm test
      - run: node scripts/smoke-server.mjs
      - run: node scripts/smoke-hosted.mjs
      - run: bash scripts/hosted/smoke-container.sh
